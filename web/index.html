<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0d" />
    <title>Relay</title>
    <meta name="description" content="Spend twelve wires across a row of gates. A gate opens if any of its wires survive. You are paid for how far the current gets." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,800&family=Rubik:wght@400;500;600&family=Chakra+Petch:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script async src="https://jam.chain.wtf/widget.js"></script>
  </head>
  <body>
    <div id="app" class="shell">
      <aside class="card sidebar">
        <header class="masthead">
          <div class="lockup">
            <svg class="brandmark" viewBox="0 0 32 32" aria-hidden="true">
              <path fill-rule="evenodd" d="M7 26 V17 A9 9 0 0 1 25 17 V26 Z M17.6 10.5 L11.8 18.6 L15 18.6 L13.8 23.8 L20.2 15.9 L17 15.9 Z" />
            </svg>
            <h1 class="title">Relay</h1>
          </div>
          <span class="plate" id="demoBadge" hidden>Demo</span>
        </header>

        <section class="instruction" aria-label="How to play">
          <p>Spend all <b>12 wires</b> across the gates.</p>
          <p>A gate opens if <b>any one</b> of its wires survives.</p>
          <p>You are paid for <b>how far</b> the current gets.</p>
        </section>

        <div class="field f-bet">
          <label class="field-label" for="wager">Bet amount</label>
          <div class="amount">
            <img class="coin" src="/assets/chusd.webp" width="22" height="22" alt="" />
            <input id="wager" name="wager" inputmode="decimal" autocomplete="off" spellcheck="false" value="1" />
            <span class="amount-sym" id="symbol">chUSD</span>
          </div>
          <div class="quick" role="group" aria-label="Adjust bet">
            <button type="button" data-bet="quarter">¼</button>
            <button type="button" data-bet="half">½</button>
            <button type="button" data-bet="double">2×</button>
            <button type="button" data-bet="max">Max</button>
          </div>
        </div>

        <div class="field f-build">
          <span class="field-label">Build</span>
          <div class="presets" id="presets" role="group" aria-label="Preset builds"></div>
        </div>

        <div class="gauges">
          <div class="gauge"><span>Top pay</span><b class="readout" id="top">—</b></div>
          <div class="gauge"><span>Any pay</span><b class="readout" id="hit">—</b></div>
          <div class="gauge"><span>Return</span><b class="readout">96.00%</b></div>
        </div>

        <div class="field recent">
          <span class="field-label">Recent runs</span>
          <div class="history" id="history" aria-label="Recent results"></div>
        </div>

        <div class="foot">
          <div class="balance-row">
            <span>Balance</span>
            <b class="readout balance-value"><img class="coin" src="/assets/chusd.webp" width="18" height="18" alt="" /><span id="balance">—</span></b>
          </div>
          <button id="run" class="cta" type="button">Run</button>
          <div class="toggles">
            <button id="auto" class="toggle" type="button" aria-pressed="false">Auto</button>
            <button id="mute" class="toggle" type="button" aria-pressed="true">Sound</button>
          </div>
          <p id="notice" class="notice" hidden></p>
        </div>
      </aside>

      <main class="stage-col">
        <div class="card stage">
          <canvas id="stage" aria-label="Relay running the gates"></canvas>
          <div class="stage-top">
            <span class="stage-caption" id="caption">Build your machine, then send the current through it.</span>
          </div>
          <div id="verdict" class="verdict" role="status" aria-live="polite"></div>
        </div>

        <div class="card meter" id="meter" aria-label="Gates">
          <div class="meter-head">
            <span class="field-label">Gates</span>
            <span class="plate plate-brass" id="pool">0 wires left</span>
          </div>
          <div class="meter-strip" id="meterStrip" role="listbox" aria-label="Gates"></div>
          <div class="meter-ctl" id="meterCtl"></div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
